<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matter.js Demo</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #0e1018;
            color: #e8eefc;
            font-family: Arial, sans-serif;
        }

        .stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        #game canvas {
            display: block;
            border-radius: 8px;
        }

        #reset {
            border: 1px solid #62f1a5;
            border-radius: 8px;
            background: #132018;
            color: #e8eefc;
            font: inherit;
            font-size: 1rem;
            padding: 10px 18px;
            cursor: pointer;
        }

        #reset:hover,
        #reset:focus-visible {
            background: #1c3326;
            outline: 2px solid #62f1a5;
            outline-offset: 2px;
        }
    </style>
</head>
<body>

<div class="stage">
    <div id="game"></div>
    <button id="reset" type="button">Reset ball</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

<script>
    // Import Matter.js tools
    const Engine = Matter.Engine;
    const Render = Matter.Render;
    const Runner = Matter.Runner;
    const Bodies = Matter.Bodies;
    const Body = Matter.Body;
    const Composite = Matter.Composite;
    const Sleeping = Matter.Sleeping;

    const ballStart = { x: 400, y: 100 };

    // Create physics engine
    const engine = Engine.create();

    // Create the display
    const render = Render.create({
        element: document.getElementById("game"),
        engine: engine,
        options: {
            width: 800,
            height: 600,
            wireframes: false,
            background: "#1b1f2a"
        }
    });

    // Create a ball
    const ball = Bodies.circle(ballStart.x, ballStart.y, 30, {
        restitution: 0.8,
        render: {
            fillStyle: "#62f1a5"
        }
    });

    // Create a ground platform
    const ground = Bodies.rectangle(400, 550, 800, 50, {
        isStatic: true,
        render: {
            fillStyle: "#58a6ff"
        }
    });

    // Add objects to the simulation
    Composite.add(engine.world, [ball, ground]);

    // Start physics and rendering.
    // Matter 0.19 aliases Engine.run to Runner.run and marks it deprecated.
    const runner = Runner.create();
    Runner.run(runner, engine);
    Render.run(render);

    function resetBall() {
        Sleeping.set(ball, false);
        Body.setPosition(ball, ballStart);
        Body.setVelocity(ball, { x: 0, y: 0 });
        Body.setAngularVelocity(ball, 0);
        Body.setAngle(ball, 0);
        ball.force.x = 0;
        ball.force.y = 0;
        ball.torque = 0;
    }

    document.getElementById("reset").addEventListener("click", resetBall);
</script>

</body>
</html>
