<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matter.js Demo</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #0e1018;
            color: #e8eefc;
            font-family: Arial, sans-serif;
        }

        .stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        #game canvas {
            display: block;
            border-radius: 8px;
        }

        .controls {
            width: min(800px, 96vw);
            display: grid;
            gap: 12px;
        }

        .control {
            display: grid;
            grid-template-columns: 7.5rem 1fr 3rem;
            align-items: center;
            gap: 10px;
            color: #d7e2ff;
        }

        .control span {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #62f1a5;
        }

        #reset {
            border: 1px solid #62f1a5;
            border-radius: 8px;
            background: #132018;
            color: #e8eefc;
            font: inherit;
            font-size: 1rem;
            padding: 10px 18px;
            cursor: pointer;
        }

        #reset:hover,
        #reset:focus-visible {
            background: #1c3326;
            outline: 2px solid #62f1a5;
            outline-offset: 2px;
        }
    </style>
</head>
<body>

<div class="stage">
    <div id="game"></div>
    <div class="controls">
        <label class="control">
            <span>Gravity</span>
            <input id="gravity" type="range" min="0" max="3" step="0.1" value="1" aria-describedby="gravity-value">
            <span id="gravity-value">1.0</span>
        </label>
        <label class="control">
            <span>Drop speed</span>
            <input id="drop-speed" type="range" min="0" max="20" step="1" value="0" aria-describedby="drop-speed-value">
            <span id="drop-speed-value">0</span>
        </label>
    </div>
    <button id="reset" type="button">Reset ball</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

<script>
    // Import Matter.js tools
    const Engine = Matter.Engine;
    const Render = Matter.Render;
    const Runner = Matter.Runner;
    const Bodies = Matter.Bodies;
    const Body = Matter.Body;
    const Composite = Matter.Composite;
    const Sleeping = Matter.Sleeping;

    const ballStart = { x: 400, y: 100 };

    // Create physics engine
    const engine = Engine.create();

    // Create the display
    const render = Render.create({
        element: document.getElementById("game"),
        engine: engine,
        options: {
            width: 800,
            height: 600,
            wireframes: false,
            background: "#1b1f2a"
        }
    });

    // Create a ball
    const ball = Bodies.circle(ballStart.x, ballStart.y, 30, {
        restitution: 0.8,
        render: {
            fillStyle: "#62f1a5"
        }
    });

    // Create a ground platform
    const ground = Bodies.rectangle(400, 550, 800, 50, {
        isStatic: true,
        render: {
            fillStyle: "#58a6ff"
        }
    });

    // Add objects to the simulation
    Composite.add(engine.world, [ball, ground]);

    // Start physics and rendering.
    // Matter 0.19 aliases Engine.run to Runner.run and marks it deprecated.
    const runner = Runner.create();
    Runner.run(runner, engine);
    Render.run(render);

    const gravityInput = document.getElementById("gravity");
    const gravityValue = document.getElementById("gravity-value");
    const dropSpeedInput = document.getElementById("drop-speed");
    const dropSpeedValue = document.getElementById("drop-speed-value");

    function applyGravity() {
        engine.gravity.y = Number(gravityInput.value);
        gravityValue.textContent = engine.gravity.y.toFixed(1);
    }

    function dropSpeed() {
        return Number(dropSpeedInput.value);
    }

    function updateDropSpeedLabel() {
        dropSpeedValue.textContent = String(dropSpeed());
    }

    function resetBall() {
        Sleeping.set(ball, false);
        Body.setPosition(ball, ballStart);
        Body.setVelocity(ball, { x: 0, y: dropSpeed() });
        Body.setAngularVelocity(ball, 0);
        Body.setAngle(ball, 0);
        ball.force.x = 0;
        ball.force.y = 0;
        ball.torque = 0;
    }

    gravityInput.addEventListener("input", applyGravity);
    dropSpeedInput.addEventListener("input", updateDropSpeedLabel);
    document.getElementById("reset").addEventListener("click", resetBall);

    applyGravity();
    updateDropSpeedLabel();
    resetBall();
</script>

</body>
</html>
